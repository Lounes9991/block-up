plugins {
    id 'com.android.application'
}

android {
    namespace 'com.empile.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.empile.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
